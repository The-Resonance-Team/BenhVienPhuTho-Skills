name: Validate Skills

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [20]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install officecli
        run: npm install -g officecli

      - name: Validate runtime assets
        run: node scripts/validate-runtime-assets.js --content-warning-threshold 80
        shell: bash

      - name: Normalize runtime assets
        run: node scripts/normalize-runtime-assets.js
        shell: bash

      - name: Verify table accessibility
        run: |
          echo "=== Checking table accessibility ==="
          FAIL=0
          
          # Files that should have tables
          TABLE_FILES=(
            "skills/phong-vattu/assets/qd-phe-duyet-chu-truong-vattu.docx"
            "skills/phong-vattu/assets/qd-phe-duyet-danh-muc-tckt.docx"
            "skills/phong-vattu/assets/qd-phe-duyet-khlcnt-vattu.docx"
            "skills/phong-vattu/assets/bb-hop-tcg-xay-hscg.docx"
            "skills/phong-vattu/assets/to-trinh-kqlcnt-vattu.docx"
            "skills/phong-vattu/assets/qd-phe-duyet-kqlcnt-vattu.docx"
            "skills/phong-vattu/assets/bb-hop-hdkh-danh-muc-tckt.docx"
            "skills/phong-vattu/assets/bb-hop-tcg-du-toan-khlcnt.docx"
            "skills/phong-vattu/assets/hop-dong-vattu.docx"
            "skills/phong-vattu/assets/qd-phe-duyet-nhiem-vu-du-toan.docx"
            "skills/phong-vattu/assets/to-trinh-khlcnt-vattu.docx"
          )
          
          for f in "${TABLE_FILES[@]}"; do
            if [ -f "$f" ]; then
              # Table count straight from the XML (no unzip dependency — windows-latest doesn't ship it)
              table_count=$(officecli raw "$f" /document 2>/dev/null | grep -o '<w:tbl' | wc -l)

              if [ "$table_count" -eq 0 ]; then
                echo "FAIL: No tables in XML - $f"
                FAIL=1
              else
                # Try to access table via officecli
                if officecli get "$f" "/body/tbl[1]" --depth 1 > /dev/null 2>&1; then
                  echo "OK: $f ($table_count tables)"
                else
                  echo "WARN: officecli get failed but tables exist in XML - $f"
                fi
              fi
            fi
          done
          exit $FAIL
        shell: bash

  cross-platform-compat:
    name: Cross-platform compatibility
    runs-on: ubuntu-latest
    needs: validate
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install officecli
        run: npm install -g officecli

      - name: Generate test output
        run: |
          # Create a test merge to verify the pipeline works
          mkdir -p /tmp/test-output
          
          # Test with one file
          TEST_FILE="skills/phong-vattu/assets/qd-phe-duyet-chu-truong-vattu.docx"
          
          if [ -f "$TEST_FILE" ]; then
            echo "Testing merge pipeline..."
            officecli merge "$TEST_FILE" /tmp/test-output/test-output.docx \
              --data '{"NGAY_KY":"28","THANG_KY":"07","NAM_KY":"2026"}' \
              --force \
              2>&1 || echo "Merge test completed (warnings OK)"
            
            if [ -f /tmp/test-output/test-output.docx ]; then
              echo "✓ Merge produced output file"
              
              # Verify output is valid
              if officecli validate /tmp/test-output/test-output.docx > /dev/null 2>&1; then
                echo "✓ Output file validates"
              else
                echo "⚠ Output file has validation warnings (OK for now)"
              fi
              
              # Check tables in output
              table_count=$(officecli raw /tmp/test-output/test-output.docx /document 2>/dev/null | grep -o '<w:tbl' | wc -l)
              echo "✓ Output has $table_count tables"
            else
              echo "✗ No output file produced"
              exit 1
            fi
          fi
        shell: bash

      - name: Verify all skills have required files
        run: |
          echo "=== Checking skill structure ==="
          FAIL=0
          
          SKILLS=$(for d in skills/phong-*/; do basename "$d"; done)
          
          for skill in $SKILLS; do
            echo "Checking $skill..."
            
            # Check SKILL.md exists
            if [ ! -f "skills/$skill/SKILL.md" ]; then
              echo "FAIL: Missing SKILL.md - $skill"
              FAIL=1
            fi
            
            # Check assets directory exists
            if [ ! -d "skills/$skill/assets" ]; then
              echo "FAIL: Missing assets/ - $skill"
              FAIL=1
            fi
            
            # Check for .docx or .xlsx files
            docx_count=$(find "skills/$skill/assets" -name "*.docx" 2>/dev/null | wc -l)
            xlsx_count=$(find "skills/$skill/assets" -name "*.xlsx" 2>/dev/null | wc -l)
            
            if [ "$docx_count" -eq 0 ] && [ "$xlsx_count" -eq 0 ]; then
              echo "FAIL: No .docx or .xlsx files - $skill"
              FAIL=1
            fi
            
            echo "OK: $skill ($docx_count docx, $xlsx_count xlsx)"
          done
          
          echo "=== All skills checked ==="
          exit $FAIL
        shell: bash

      - name: Check plugin manifest
        run: |
          echo "=== Checking plugin manifest ==="
          
          if [ ! -f ".claude-plugin/plugin.json" ]; then
            echo "FAIL: Missing .claude-plugin/plugin.json"
            exit 1
          fi
          
          # Check if all skills in assets are in manifest
          MANIFEST_SKILLS=$(cat .claude-plugin/plugin.json | grep -o '"[^"]*"' | tr -d '"' | grep "^phong-")
          
          FAIL=0
          for skill_dir in skills/phong-*/; do
            skill=$(basename "$skill_dir")
            if ! echo "$MANIFEST_SKILLS" | grep -q "^${skill}$"; then
              echo "FAIL: $skill not in plugin.json"
              FAIL=1
            else
              echo "OK: $skill in manifest"
            fi
          done
          
          exit $FAIL
        shell: bash

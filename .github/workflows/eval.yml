name: Eval Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  validate-evals:
    name: Validate eval structure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install officecli
        run: npm install -g @officecli/officecli

      - name: Run eval validator
        run: node scripts/run-evals.js
        shell: bash

  run-evals:
    name: Run eval cases via OpenCode
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: validate-evals
    if: |
      github.event_name == 'push' && github.ref == 'refs/heads/main' ||
      contains(github.event.comment.body, ' /eval') ||
      startsWith(github.event.comment.body, '/eval') ||
      contains(github.event.comment.body, ' /oc') ||
      startsWith(github.event.comment.body, '/oc')
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install officecli
        run: npm install -g @officecli/officecli

      - name: Run eval cases
        run: node scripts/run-evals.js --opencode
        shell: bash
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_MODEL: opencode-go/deepseek-v4-flash

      - name: Post results to PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');

            let report;
            try {
              report = execSync('node scripts/run-evals.js', { encoding: 'utf8' });
            } catch (e) {
              report = e.stdout || e.message;
            }

            const body = `## Eval Suite Results\n\n\`\`\`\n${report}\n\`\`\``;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

name: Eval Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  validate-evals:
    name: Validate eval structure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install officecli
        run: npm install -g @officecli/officecli

      - name: Run eval validator
        run: node scripts/run-evals.js
        shell: bash

  behavior-run:
    name: Behavior run (promptfoo + OpenCode)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: validate-evals
    if: |
      github.event_name == 'pull_request' ||
      github.event_name == 'pull_request_review_comment' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && (
        contains(github.event.comment.body, ' /eval') ||
        startsWith(github.event.comment.body, '/eval') ||
        contains(github.event.comment.body, ' /oc') ||
        startsWith(github.event.comment.body, '/oc')
      ))
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache promptfoo
        uses: actions/cache@v4
        with:
          path: ~/.cache/promptfoo
          key: ${{ runner.os }}-promptfoo-v1
          restore-keys: |
            ${{ runner.os }}-promptfoo-

      - name: Install OpenCode
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Install skills from this checkout
        run: npx -y skills@latest add . --agent opencode --global --skill '*' --copy --yes

      - name: Run behavior run
        id: behavior_run
        continue-on-error: true # report-only — see docs/adr/0001-*
        run: |
          npx -y promptfoo@latest eval \
            -c evals/promptfooconfig.yaml \
            -o evals/results.json \
            --max-concurrency 2 \
            > evals/behavior-run-summary.txt 2>&1 || true
          cat evals/behavior-run-summary.txt
        env:
          OPENCODE_CONFIG: ${{ github.workspace }}/evals/opencode.ci.jsonc
          BVPT_VLLM_API_KEY: ${{ secrets.BVPT_VLLM_API_KEY }}
          # Promptfoo's openai grader auto-reads these env vars — keeps
          # promptfooconfig.yaml free of template placeholders that trip
          # credential-scanning pre-commit hooks.
          OPENAI_API_KEY: ${{ secrets.BVPT_VLLM_API_KEY }}
          OPENAI_BASE_URL: https://api-bvpt.resonance.io.vn/v1

      - name: Upload behavior run results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: behavior-run-results
          path: |
            evals/results.json
            evals/behavior-run-summary.txt
          retention-days: 14
          if-no-files-found: warn

      - name: Post behavior run summary
        if: always() && (github.event_name == 'pull_request' || github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment')
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let summary = 'Behavior run did not produce output — check the workflow logs and the behavior-run-results artifact.';
            try {
              summary = fs.readFileSync('evals/behavior-run-summary.txt', 'utf8');
            } catch (e) {
              // no-op — fall back to the placeholder message above
            }
            const maxLen = 60000;
            const truncated =
              summary.length > maxLen
                ? summary.slice(0, maxLen) + '\n... (truncated — full output in the behavior-run-results artifact)'
                : summary;

            const body = `## Behavior run (report-only)\n\nSelf-judged via \`llm-rubric\` on the self-hosted model — see [ADR 0001](../blob/main/docs/adr/0001-promptfoo-behavior-run-self-hosted-model.md). A green run means "nothing obviously changed," not proof of correctness; this never blocks the PR.\n\n<details><summary>Output</summary>\n\n\`\`\`\n${truncated}\n\`\`\`\n\n</details>`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

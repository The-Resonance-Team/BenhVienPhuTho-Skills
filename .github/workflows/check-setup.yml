name: Check setup.ps1

on:
  push:
    paths: [setup.ps1]
  pull_request:
    paths: [setup.ps1]
  workflow_dispatch:

jobs:
  check-setup:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-2019, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path setup.ps1).Path,
            [ref]$null,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
          Write-Host "Syntax OK"

      - name: Run -CheckOnly
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process RemoteSigned -Force
          $out = .\setup.ps1 -CheckOnly 2>&1
          $out | Out-Host
          @"
          ## setup.ps1 -CheckOnly (${{ matrix.os }})

          ``````powershell
          $($out -join "`n")
          ``````
          "@ >> $env:GITHUB_STEP_SUMMARY

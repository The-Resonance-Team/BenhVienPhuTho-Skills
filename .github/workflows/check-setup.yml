name: Check setup.ps1

on:
  push:
    paths: [setup.ps1]
  pull_request:
    paths: [setup.ps1]
  workflow_dispatch:

jobs:
  check-setup:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-2019, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path setup.ps1).Path,
            [ref]$null,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
          Write-Host "Syntax OK"

      - name: Run -CheckOnly
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process RemoteSigned -Force
          $out = .\setup.ps1 -CheckOnly 2>&1
          $out | Out-Host
          $out | Out-File -FilePath checkonly-output.txt -Encoding utf8
          @"
          ## setup.ps1 -CheckOnly (${{ matrix.os }})

          ``````powershell
          $($out -join "`n")
          ``````
          "@ >> $env:GITHUB_STEP_SUMMARY

      - name: Verify expected tools (new computer baseline)
        shell: pwsh
        run: |
          $out = Get-Content checkonly-output.txt -Raw
          $fail = $false

          # Tools pre-installed on GitHub runners — must be detected
          foreach ($tool in @("git","node","npm","python")) {
            if ($out -match "\[OK\]\s+$tool") {
              Write-Host "[PASS] $tool detected" -ForegroundColor Green
            } else {
              Write-Warning "[FAIL] $tool not detected — regression in detection logic"
              $fail = $true
            }
          }

          # Tools NOT expected on a fresh runner — should show "--"
          foreach ($tool in @("officecli","opencode","pandoc","tesseract")) {
            if ($out -match "\[OK\]\s+$tool") {
              Write-Host "[INFO] $tool present (unexpected on fresh runner)" -ForegroundColor Yellow
            } else {
              Write-Host "[PASS] $tool not installed (expected on new computer)" -ForegroundColor Green
            }
          }

          # Internet must be reachable
          if ($out -match "Internet: OK") {
            Write-Host "[PASS] Internet reachable" -ForegroundColor Green
          } else {
            Write-Warning "[FAIL] Internet unreachable — network probe broken or GitHub blocked"
            $fail = $true
          }

          if ($fail) { exit 1 }
          Write-Host "`nAll baseline checks passed."
